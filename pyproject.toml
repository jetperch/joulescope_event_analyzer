[build-system]
requires = ["setuptools>=77"]   # SPDX license expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "joulescope_event_analyzer"
dynamic = ["version"]
description = "Find, measure, group and compare current events in Joulescope captures."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "LICENSES/*.txt"]
authors = [{ name = "Jetperch LLC", email = "joulescope-dev@jetperch.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pyjls>=0.19",
]
keywords = ["joulescope", "power", "energy", "current", "battery", "embedded", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = ["pytest", "coverage", "reuse"]

[project.urls]
Homepage = "https://github.com/jetperch/joulescope_event_analyzer"
Repository = "https://github.com/jetperch/joulescope_event_analyzer"
Issues = "https://github.com/jetperch/joulescope_event_analyzer/issues"
Changelog = "https://github.com/jetperch/joulescope_event_analyzer/blob/main/CHANGELOG.md"
Joulescope = "https://www.joulescope.com"

[project.scripts]
joulescope_event_analyzer = "joulescope_event_analyzer.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "joulescope_event_analyzer.version.__version__" }

[tool.setuptools.packages.find]
include = ["joulescope_event_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
