# Build the sdist and wheel on every push, and publish to PyPI on a v* tag.
#
# Release: update version.py and CHANGELOG.md, commit, then
#     git tag v0.1.0 && git push origin v0.1.0
# Publishing uses PyPI trusted publishing (no token).  The PyPI trusted
# publisher must name owner jetperch, repository joulescope_event_analyzer,
# workflow packaging.yml and environment pypi.

name: Packaging

on:
  push:
  pull_request:
  workflow_dispatch:   # build (and test) on request, without publishing

env:
  PYTHON_VERSION: '3.13'

jobs:

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('joulescope_event_analyzer/version.py')['__version__'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version.py ${version}"
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test_wheel:
    name: Test wheel ${{ matrix.os }} python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repo (tests only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel
        shell: bash
        run: python -m pip install pytest dist/*.whl

      - name: Run tests against the installed wheel
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/t"
          cp -r tests "$RUNNER_TEMP/t/"
          cd "$RUNNER_TEMP/t"
          python -m pytest -q tests

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test_wheel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write    # PyPI trusted publishing
      contents: write    # GitHub release assets
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
